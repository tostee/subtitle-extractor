# Publica una versión al subir una etiqueta vX.Y.Z:
#   1. comprueba que coincide con <Version> de Directory.Build.props,
#   2. ejecuta las pruebas y compila el instalador (build-installer.ps1),
#   3. crea la Release de GitHub con el instalador y su huella .sha256 (la app los usa para actualizarse).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Comprobar versión
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME.TrimStart('v')
          [xml]$props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ($tag -ne $version) { throw "La etiqueta v$tag no coincide con <Version>$version</Version> de Directory.Build.props." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Instalar Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Pruebas e instalador
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version $env:VERSION

      - name: Notas de la versión (CHANGELOG.md)
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Versión $env:VERSION." }
          [IO.File]::WriteAllText("release-notes.md", $notes)

      - name: Publicar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = "installer/Output/Subtitulos-Setup-$env:VERSION.exe"
          gh release create $env:GITHUB_REF_NAME $setup "$setup.sha256" --title "Subtítulos $env:VERSION" --notes-file release-notes.md --verify-tag
